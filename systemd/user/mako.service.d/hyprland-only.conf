# mako and Plasma both ship a D-Bus activation file claiming
# org.freedesktop.Notifications, and dbus picks mako's. In a Plasma session the
# first notification activates mako seconds after login -- before plasmashell
# has claimed the name -- and KDE's notification stack is left dead for the rest
# of the session. The packaged unit only guards on WAYLAND_DISPLAY, which is set
# under Plasma too, so add the guard it is missing: mako belongs to Hyprland.
#
# ExecCondition= is a list, so this runs in addition to the packaged check.
# Exiting 1 makes systemd skip the unit cleanly (not fail it), which leaves the
# bus name free for plasmashell.
[Service]
ExecCondition=/bin/sh -c 'case "$XDG_CURRENT_DESKTOP" in *Hyprland*) exit 0 ;; *) exit 1 ;; esac'
