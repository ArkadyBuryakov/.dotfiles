# Arch Linux guest. BOOT also accepts: alpine, cachy, debian, fedora, gentoo,
# kali, mint, nixos, suse, tails, ubuntu, ubuntus, zorin — or a URL to any
# .iso/.qcow2/.img/.vhdx (compressed ones are extracted automatically).
#
# Backend: https://github.com/qemus/qemu

KIND=linux
BOOT=arch

RAM_SIZE=10G
CPU_CORES=4
DISK_SIZE=64G

# 'arch' pulls the official Arch-Linux-x86_64-basic.qcow2 cloud image, which is
# already installed and boots to a login: user 'arch', password 'arch'. Change
# that password on first login.
#
# Start on 'web' — noVNC is the only way in until you set up something better.
# For a KDE guest, install krdp and enable System Settings > Remote Desktop,
# then set this to 'rdp' and re-run `vm install arch` (see vm/README.md).
# RDP gives a native window with a synced clipboard, and `vm launch` stops the
# container again when you close it.
ACCESS=web
# ACCESS=rdp
WEB_PORT=8007
RDP_PORT=3390

# RDP account. For a KDE guest this is the KRDP username you set in
# System Settings > Remote Desktop, NOT the login account.
USERNAME=arch

# How the guest display follows the RDP window.
#   dynamic - guest resizes to the window. Needs the server to support the
#             RDPEDISP channel; KRDP only gained it AFTER 6.7.4, so this does
#             nothing on a current Plasma guest.
#   smart   - guest keeps RDP_SIZE and the image scales to the window. Use this
#             until krdp ships DisplayControl.
#   fixed   - connect at exactly RDP_SIZE, no scaling.
RDP_SIZING=smart
RDP_SIZE=1920x1080

# Host port forwarded to the guest's sshd. Leave empty to not expose it.
SSH_PORT=2222

# Hardware OpenGL + Vulkan through /dev/dri. Only affects the noVNC console;
# RDP is a software path regardless.
#
# Keep this off with a KDE guest. On Lunar Lake the GPU uses the 'xe' driver, so
# native contexts (vDRM) are unavailable and acceleration falls back to virgl.
# kwin_wayland submits commands virglrenderer rejects, which kills the GL
# context and freezes the desktop:
#   vrend_decode_ctx_submit_cmd: context error reported "kwin_wayland"
#                                Illegal command buffer
GPU=N
AUDIO=Y

DESCRIPTION="Arch Linux"
