# Windows 11 Pro, unactivated. Needs your own licence key for the gated
# features; `vm key` prints this machine's OEM key, but an OEM key is bound to
# the hardware and normally will not activate a VM.
#
# Backend: https://github.com/dockur/windows

KIND=windows
VERSION=11

RAM_SIZE=8G
CPU_CORES=4
DISK_SIZE=64G

# Guest account. The password is asked for on `vm install` and stored, mode
# 0600, in ~/.local/share/vm/windows/password — never in this repo.
USERNAME=arkady

# RDP gives a real window with sound, mic, clipboard and dynamic resolution.
# The web console on WEB_PORT stays available either way.
ACCESS=rdp
WEB_PORT=8006
RDP_PORT=3389

DESCRIPTION="Windows"
