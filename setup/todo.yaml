apply_config: apply config files (make symlinks)
add_repos: add chaoticaur and arch4edu repositories
dependencies: install all dependencies
howdy_setup: install howdy
pam_config: install PAM stacks from pam.d/ (password first, howdy fallback)
antivirus: install and setup clamav
apps: add symlinks for applications
aesthetics: >-
  1. Copy custom icons
setup_docker: >-
  Setup rootless docker (the docker group is root-equivalent, so we do not use it):
  1. Disable the system-wide docker daemon and drop the user from the docker group
  2. Install the rootless daemon and enable it as a user service with lingering
  3. Switch the docker context to rootless and allow unprivileged ports >= 80
virtual_machines: >-
  Setup docker-hosted VMs (see vm/README.md):
  1. Create ~/VMs and check KVM, freerdp and rootless docker are in place
  2. VMs are declared in vm/vms.d/*.conf and managed with `vm`
copy_global_configs: >-
  1. 1password
  2. greetd
  3. *howdy - pass
  4. keyd
setup_silicon: symlink config and build cache
