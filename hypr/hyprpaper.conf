preload = ~/.config/hypr/wallpapers/Chashnik.jpeg

# An empty `monitor` is hyprpaper's catch-all: the wallpaper is applied to every
# output, including ones this config knows nothing about. Naming outputs here
# instead silently leaves any other screen black.
wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/Chashnik.jpeg
    fit_mode = cover
}

splash=false
ipc=off
