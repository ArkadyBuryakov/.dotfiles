general {
    # Single entry point for locking: everything else calls `loginctl lock-session`.
    # The pidof guard keeps a second hyprlock from stacking on an existing lock
    # (that froze the clock on the visible lock surface).
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; nmcli radio wifi on;
}

listener {
    timeout = 300 # 5 minutes to lock screen
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
