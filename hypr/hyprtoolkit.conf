# Theme for hyprtoolkit apps (hyprpolkitagent's authentication dialog, ...).
# https://wiki.hypr.land/Hypr-Ecosystem/hyprtoolkit/
#
# Follows the rest of the rice: the kitty palette
# (kitty/themes/Neutron_custom.conf) and the flat, square look of the
# rofi/mako/quickshell surfaces. Colours are 0xAARRGGBB.

background = 0xFF1B1D22
# Input fields and buttons, and their hovered/alternate shade
base = 0xFF2E353D
alternate_base = 0xFF454B55

text = 0xFFE6E8EE
bright_text = 0xFFEBEDF2

accent = 0xFF6A7B92
accent_secondary = 0xFF3F93A8

font_family = JetBrainsMono Nerd Font Mono
font_family_monospace = JetBrainsMono Nerd Font Mono

rounding_large = 0
rounding_small = 0

# Near-uniform sizes instead of the default 19/15/13/11/10 spread, which reads
# as five unrelated sizes in a small dialog.
#
# These exact values also matter: at some sizes hyprtoolkit measures a label
# narrower than it then draws it on a fractionally scaled output, and the text
# gets ellipsized ("Allow this actio..."). 13 and 12 fit; 14 and 11 did not.
h1_size = 13
h2_size = 13
h3_size = 12
font_size = 12
small_font_size = 12
