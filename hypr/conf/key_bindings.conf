# ##############################################################################
# Hotkeys
# ##############################################################################

$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bindp = $mainMod, T, exec, $terminal
bindp = $mainMod, Q, killactive,
# bindp = $mainMod, F, exec, $fileManager
bindp = $mainMod, F, exec, $guiFileManager
bindp = $mainMod, B, exec, zen-browser
bindp = $mainMod SHIFT, B, exec, zen-browser --private-window
bindp = $mainMod ALT, B, exec, chromium
bindp = $mainMod, escape, exec, hyprlock
bindp = $mainMod SHIFT, escape, exec, pkill wlogout || wlogout
bindp = $mainMod, V, togglefloating,
bindp = $mainMod SHIFT, V, pin,
bindpr = $mainMod, SUPER_L, exec, pkill $menu || $menu -show drun
# bind = $mainMod, W, togglesplit, # dwindle
bindp = $mainMod, G, togglegroup
bindp = $mainMod SHIFT, G, lockactivegroup, toggle
bindp = $mainMod, bracketleft, changegroupactive, b
bindp = $mainMod, bracketright, changegroupactive, f
bindp = $mainMod SHIFT, bracketleft, movegroupwindow, b
bindp = $mainMod SHIFT, bracketright, movegroupwindow, f
bindp = , f11, fullscreen,
bindp = $mainMod, R, exec, ~/.config/hypr/scripts/workspace_reassign.sh
bindp = $mainMod, N, exec, ~/.config/hypr/scripts/toggle_vpn.sh "Personal DE"
bindp = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/toggle_vpn.sh "Personal US"
bindp = $mainMod ALT, N, exec, ~/.config/hypr/scripts/toggle_vpn.sh "Personal RU"
bindp = $mainMod, D, exec, ~/.config/hypr/scripts/toggle_dnd.sh
bindp = $mainMod SHIFT, D, exec, makoctl dismiss -a
bindp = $mainMod, Tab, exec, ~/.config/hypr/scripts/jaeger/jaeger.sh toggle
bindp = $mainMod ALT, 1, exec, ~/.config/hypr/scripts/jaeger/goto.sh 1
bindp = $mainMod ALT, 2, exec, ~/.config/hypr/scripts/jaeger/goto.sh 2
bindp = $mainMod ALT, 3, exec, ~/.config/hypr/scripts/jaeger/goto.sh 3
bindp = $mainMod ALT, 4, exec, ~/.config/hypr/scripts/jaeger/goto.sh 4
bindp = $mainMod ALT, 5, exec, ~/.config/hypr/scripts/jaeger/goto.sh 5
bindp = $mainMod ALT, 6, exec, ~/.config/hypr/scripts/jaeger/goto.sh 6
bindp = $mainMod ALT, 7, exec, ~/.config/hypr/scripts/jaeger/goto.sh 7
bindp = $mainMod ALT, 8, exec, ~/.config/hypr/scripts/jaeger/goto.sh 8
bindp = $mainMod ALT, 9, exec, ~/.config/hypr/scripts/jaeger/goto.sh 9

# Screenshots and screencasts
bindp = , Print, exec, grimblast --notify --freeze copy area
bindp = SHIFT, Print, exec, grimblast --notify --cursor copy output
bindp = $mainMod, P, exec, grimblast --notify --freeze copy area
bindp = $mainMod CTRL, P, exec, grimblast --notify --cursor copy active
bindp = $mainMod SHIFT, P, exec, grimblast --notify --cursor copy output
bindp = $mainMod ALT, P, exec, pkill kooha || kooha
bindp = $mainMod, A, exec, pkill swappy || ~/.config/hypr/scripts/image-annotation.sh

# Special Keys
bindp = , xf86monbrightnessup, exec, hyprctl dispatch dpms on && brightnessctl set 10%+
bindp = , xf86monbrightnessdown, exec, brightnessctl set 10%-
bindple = , code:123, exec, ~/.config/hypr/scripts/volume.sh up
bindple = , code:122, exec, ~/.config/hypr/scripts/volume.sh down
bindpl = , xf86audiomute, exec, ~/.config/hypr/scripts/volume.sh toggle
bindp = , XF86AudioPause, exec, playerctl play-pause
bindp = , XF86AudioNext, exec, playerctl next
bindp = , XF86AudioPrev, exec, playerctl previous
bindp = $mainMod SHIFT, f23, exec, zen-browser --new-window "https://t3.chat"

# Move focus with mainMod + arrow keys
bindp = $mainMod, h, movefocus, l
bindp = $mainMod, l, movefocus, r
bindp = $mainMod, k, movefocus, u
bindp = $mainMod, j, movefocus, d
bindp = $mainMod SHIFT, h, movewindoworgroup, l
bindp = $mainMod SHIFT, l, movewindoworgroup, r
bindp = $mainMod SHIFT, k, movewindoworgroup, u
bindp = $mainMod SHIFT, j, movewindoworgroup, d
bindp = $mainMod, left, movefocus, l
bindp = $mainMod, right, movefocus, r
bindp = $mainMod, up, movefocus, u
bindp = $mainMod, down, movefocus, d
bindp = $mainMod SHIFT, left, movewindoworgroup, l
bindp = $mainMod SHIFT, right, movewindoworgroup, r
bindp = $mainMod SHIFT, up, movewindoworgroup, u
bindp = $mainMod SHIFT, down, movewindoworgroup, d

# Switch workspaces with mainMod + [1-9]
bindp = $mainMod, 1, exec, ~/.config/hypr/scripts/navigate.sh workspace 1 false
bindp = $mainMod, 2, exec, ~/.config/hypr/scripts/navigate.sh workspace 2 false
bindp = $mainMod, 3, exec, ~/.config/hypr/scripts/navigate.sh workspace 3 false
bindp = $mainMod, 4, exec, ~/.config/hypr/scripts/navigate.sh workspace 4 false
bindp = $mainMod, 5, exec, ~/.config/hypr/scripts/navigate.sh workspace 5 false
bindp = $mainMod, 6, exec, ~/.config/hypr/scripts/navigate.sh workspace 6 false
bindp = $mainMod, 7, exec, ~/.config/hypr/scripts/navigate.sh workspace 7 false
bindp = $mainMod, 8, exec, ~/.config/hypr/scripts/navigate.sh workspace 8 false
bindp = $mainMod, 9, exec, ~/.config/hypr/scripts/navigate.sh workspace 9 false
bindp = $mainMod CTRL, 1, exec, ~/.config/hypr/scripts/navigate.sh workspace 1 true
bindp = $mainMod CTRL, 2, exec, ~/.config/hypr/scripts/navigate.sh workspace 2 true
bindp = $mainMod CTRL, 3, exec, ~/.config/hypr/scripts/navigate.sh workspace 3 true
bindp = $mainMod CTRL, 4, exec, ~/.config/hypr/scripts/navigate.sh workspace 4 true
bindp = $mainMod CTRL, 5, exec, ~/.config/hypr/scripts/navigate.sh workspace 5 true
bindp = $mainMod CTRL, 6, exec, ~/.config/hypr/scripts/navigate.sh workspace 6 true
bindp = $mainMod CTRL, 7, exec, ~/.config/hypr/scripts/navigate.sh workspace 7 true
bindp = $mainMod CTRL, 8, exec, ~/.config/hypr/scripts/navigate.sh workspace 8 true
bindp = $mainMod CTRL, 9, exec, ~/.config/hypr/scripts/navigate.sh workspace 9 true

bindp = $mainMod, 0, exec, notify-send "Copied hex value: $(hyprpicker -a)"

# Move active window to a workspace with mainMod + SHIFT + [1-9]
bindp = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 1 false
bindp = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 2 false
bindp = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 3 false
bindp = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 4 false
bindp = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 5 false
bindp = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 6 false
bindp = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 7 false
bindp = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 8 false
bindp = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 9 false
bindp = $mainMod CTRL SHIFT, 1, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 1 true
bindp = $mainMod CTRL SHIFT, 2, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 2 true
bindp = $mainMod CTRL SHIFT, 3, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 3 true
bindp = $mainMod CTRL SHIFT, 4, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 4 true
bindp = $mainMod CTRL SHIFT, 5, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 5 true
bindp = $mainMod CTRL SHIFT, 6, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 6 true
bindp = $mainMod CTRL SHIFT, 7, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 7 true
bindp = $mainMod CTRL SHIFT, 8, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 8 true
bindp = $mainMod CTRL SHIFT, 9, exec, ~/.config/hypr/scripts/navigate.sh movetoworkspace 9 true

# Special workspaces
bindp = $mainMod, S, togglespecialworkspace, magic
bindp = $mainMod SHIFT, S, movetoworkspace, special:magic
bindp = $mainMod, C, togglespecialworkspace, config
bindp = $mainMod SHIFT, C, movetoworkspace, special:config
bindp = $mainMod, M, togglespecialworkspace, monorepo_fleetcraft
bindp = $mainMod SHIFT, M, movetoworkspace, special:monorepo_fleetcraft
bindp = $mainMod CTRL, M, togglespecialworkspace, monorepo_aino
bindp = $mainMod CTRL SHIFT, M, movetoworkspace, special:monorepo_aino

# Scroll through existing workspaces with mainMod + scroll
bindp = $mainMod CTRL, l , workspace, +1
bindp = $mainMod CTRL, h, workspace, -1
bindp = $mainMod CTRL SHIFT, l , movetoworkspace, +1
bindp = $mainMod CTRL SHIFT, h, movetoworkspace, -1
bindp = $mainMod CTRL, right , workspace, +1
bindp = $mainMod CTRL, left, workspace, -1
bindp = $mainMod CTRL SHIFT, right , movetoworkspace, +1
bindp = $mainMod CTRL SHIFT, left, movetoworkspace, -1

# Scroll through existing monitors
bindp = $mainMod CTRL, k , focusmonitor, +1
bindp = $mainMod CTRL, j, focusmonitor, -1
bindp = $mainMod CTRL SHIFT, k , movewindow, mon:+1
bindp = $mainMod CTRL SHIFT, j, movewindow, mon:-1
bindp = $mainMod CTRL, up , focusmonitor, +1
bindp = $mainMod CTRL, down, focusmonitor, -1
bindp = $mainMod CTRL SHIFT, up , movewindow, mon:+1
bindp = $mainMod CTRL SHIFT, down, movewindow, mon:-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmp = $mainMod, mouse:272, movewindow
bindmp = $mainMod ALT, mouse:272, resizewindow

