# yaml-language-server: $schema=https://json.schemastore.org/lazydocker.json

gui:
  returnImmediately: true
  # Square frames, like the rofi/mako/quickshell surfaces
  border: single
  # Same theme as lazygit/config.yml; colours from the kitty palette
  # (kitty/themes/Neutron_custom.conf)
  theme:
    activeBorderColor:
      - "#DDB566"
      - bold
    inactiveBorderColor:
      - "#6A7B92"
    selectedLineBgColor:
      - "#2E353D"
    optionsTextColor:
      - "#6A7B92"

customCommands:
  containers:
    - name: lnav
      attach: true
      command: "lnav docker://{{ .Container.ID }}"
