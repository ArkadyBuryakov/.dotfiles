# Rootless Docker's network stack (slirp4netns/pasta under RootlessKit) creates a
# tap device inside its network namespace, which needs the tun driver.
#
# /dev/net/tun is a static device node that exists whether or not the driver is
# loaded, so its presence proves nothing — opening it returns ENODEV until the
# module is in. Autoloading on first open is also unreliable here, because the
# open happens inside an unprivileged user namespace where the kernel may refuse
# the implicit request_module. Loading it at boot removes both problems.
tun
