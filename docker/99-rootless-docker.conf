# Rootless Docker cannot bind privileged ports (< 1024) by default, which breaks
# the usual `-p 80:80` / `-p 443:443` development containers.
#
# 80 is the lowest port that still needs to work; everything below it (SSH on 22,
# DNS on 53, and the rest) stays privileged.
net.ipv4.ip_unprivileged_port_start = 80
