# Read by /usr/bin/claude-desktop, one or more flags per line.
#
# Electron only picks a keyring backend on its own under GNOME or KDE. With
# XDG_CURRENT_DESKTOP=Hyprland it falls back to storing secrets unencrypted.
# gnome-libsecret talks to whatever owns org.freedesktop.secrets, which here
# is ksecretd (KWallet), not gnome-keyring.
--password-store=gnome-libsecret
